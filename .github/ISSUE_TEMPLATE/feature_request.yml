name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should Bastion do?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [UI, API, MCP, Scan engine, AI, Reports, Deployment, Docs]
