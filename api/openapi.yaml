openapi: 3.1.0
info:
  title: Bastion API
  version: 0.0.0
  description: Stub. Endpoints are added in Phase 1.
paths:
  /health:
    get:
      responses:
        "200":
          description: Server is healthy
  /api/v1/targets:
    get:
      responses:
        "200":
          description: Targets
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, value]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [cidr, domain, url, repository, cloud_account]
                value:
                  type: string
      responses:
        "201":
          description: Target created
        "400":
          description: Invalid target
  /api/v1/targets/{target_id}/attestation:
    post:
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement:
                  type: string
      responses:
        "200":
          description: Authorization attestation recorded (prototype statement only)
        "400":
          description: Attestation statement is required
        "404":
          description: Target not found
  /api/v1/scans:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id:
                  type: string
                profile:
                  type: string
                  enum: [safe, quick, full, web]
      responses:
        "201":
          description: Scan runner completed
        "403":
          description: Target is not authorized
        "404":
          description: Target not found
        "500":
          description: Scan runner failed; scan status is marked failed
  /api/v1/scans/{scan_id}:
    get:
      parameters:
        - name: scan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scan status
        "404":
          description: Scan not found
  /api/v1/scans/{scan_id}/retest:
    post:
      parameters:
        - name: scan_id
          in: path
          required: true
          schema:
            type: string
      description: Starts a new scan of the same authorized target using the safe profile.
      responses:
        "201":
          description: Retest scan created
        "400":
          description: Only completed safe-profile scans can be retested
        "403":
          description: Target is not authorized
        "404":
          description: Scan or target not found
        "500":
          description: Retest runner or persistence failed
  /api/v1/scans/{scan_id}/compare/{other_scan_id}:
    get:
      parameters:
        - name: scan_id
          in: path
          required: true
          description: Baseline scan
          schema:
            type: string
        - name: other_scan_id
          in: path
          required: true
          description: Current scan
          schema:
            type: string
      responses:
        "200":
          description: New, fixed, and unchanged findings by stable finding ID
        "404":
          description: Scan not found
        "409":
          description: Scans must be complete and belong to the same target
  /api/v1/scans/{scan_id}/findings:
    get:
      parameters:
        - name: scan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Findings for the scan
        "404":
          description: Scan not found
  /api/v1/findings:
    get:
      parameters:
        - name: scan_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Findings for the scan
        "400":
          description: Missing scan_id
