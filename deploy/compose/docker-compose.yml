services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${BASTION_DB_USER:-bastion}
      POSTGRES_DB: ${BASTION_DB_NAME:-bastion}
      POSTGRES_PASSWORD: ${BASTION_DB_PASSWORD:?Set BASTION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bastion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bastion-postgres:
